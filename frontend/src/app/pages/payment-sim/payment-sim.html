<div class="min-h-screen flex items-center justify-center bg-gray-150 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl border border-gray-200">
    <div class="text-center">
      <!-- PhonePe Mock Logo -->
      <div class="inline-flex items-center justify-center h-16 w-16 bg-purple-600 rounded-full text-white font-extrabold text-2xl shadow-md">
        Pe
      </div>
      <h2 class="mt-4 text-2xl font-extrabold text-gray-900">PhonePe Payment Gateway</h2>
      <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider mt-1">Simulator Sandbox Mode</p>
    </div>

    <!-- Details Card -->
    <div class="bg-gray-50 border border-gray-100 p-4 rounded-xl space-y-2 text-sm text-gray-700">
      <div class="flex justify-between">
        <span class="text-gray-400 font-medium">Merchant Txn ID:</span>
        <span class="font-mono font-bold text-gray-900">{{ merchantOrderId() }}</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="space-y-3">
      <button
        (click)="processPayment('completed')"
        [disabled]="isLoading()"
        class="w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none transition disabled:opacity-50"
      >
        Simulate Successful Payment (Success)
      </button>

      <button
        (click)="processPayment('failed')"
        [disabled]="isLoading()"
        class="w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-red-600 hover:bg-red-700 focus:outline-none transition disabled:opacity-50"
      >
        Simulate Failed Payment (Fail)
      </button>
    </div>
  </div>
</div>
